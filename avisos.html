<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comunidade 5 - Avisos</title>

    <link rel="shortcut icon" href="/static/assets/LOGO 4 SEM FUNDO.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>
        <a href="/">
            <img src="/static/assets/LOGO 4 SEM FUNDO.png" alt="Logo Paróquia Santo Antônio">
        </a>

        <div class="links-header">
            <a href="/">Início</a>
            <a href="">Sobre</a>
            <a href="">Suporte</a>
            <a href="">Quero participar</a>
        </div>
    </header>

    <div class="main">

        <ol id="lista">

            {% for aviso in avisos %}
            <li class="itens">
                <p>{{ aviso.aviso }}</p>
            </li>
            {% else %}
            <li class="itens">
                <p>Nenhum aviso cadastrado.</p>
            </li>
            {% endfor %}

        </ol>

        <div class="form">
            <input type="text" id="tarefa" placeholder="">

            <div class="btn-form">
                <button id="btn-add">Adicionar</button>
                <button id="btn-remove">Remover</button>
            </div>
        </div>

    </div>

    <script src="/static/js/script.js"></script>

</body>

</html>
